flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path_ios: "assets/images/app.icon.ios.png"
  remove_alpha_channel_ios: true
  image_path: "assets/images/app.icon.png"
  remove_alpha_channel: false
  adaptive_icon_background: "#6D3BE6"
  adaptive_icon_foreground: "assets/images/app.icon.foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app.icon.png"
    background_color: "#0D0D14"
    theme_color: "#6A4BE8"
  windows:
    generate: true
    image_path: "assets/images/app.icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app.icon.png"
