name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated sources are committed; this fails the build if they drifted
      # from their inputs.
      - name: Verify generated sources are up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- '*.g.dart' '*.drift.dart'

      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: euphony-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
