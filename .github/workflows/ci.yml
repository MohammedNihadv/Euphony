name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the publish job opts up to contents: write.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate code and format
        run: |
          dart run build_runner build
          dart format .

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test --coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt

      - name: Generate code for Release build
        run: |
          dart run build_runner build

      # Sign every release with one stable key so users can update between
      # versions (an unsigned/debug build gets a fresh key each run, and Android
      # refuses to install an update whose signature changed). Falls back to
      # debug signing when the secret is absent, so forks still build.
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/euphony-release.jks
          {
            echo "storeFile=euphony-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build F-Droid APKs (Reproducible / Self-Updates Disabled)
        run: |
          flutter build apk --release --split-per-abi --dart-define=ENABLE_UPDATES=false
          mkdir -p build/app/outputs/fdroid
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")
            cp "$f" "build/app/outputs/fdroid/${filename/app-/app-fdroid-}"
          done

      - name: Build Standard Release APKs (Direct / In-App Updates Enabled)
        env:
          ENABLE_IN_APP_INSTALL: 'true'
        run: flutter build apk --release --split-per-abi --dart-define=ENABLE_UPDATES=true

      - uses: actions/upload-artifact@v7
        with:
          name: euphony-release-apks
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/fdroid/app-fdroid-*-release.apk
          if-no-files-found: error

  # Desktop builds only run for release tags — they are slower and the Android
  # app is what most pushes touch. Branch/PR desktop builds live in desktop.yml.
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Pre-download and extract smtc_windows binary bundle
        shell: pwsh
        run: |
          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          $smtcDir = Get-ChildItem -Path "$pubCache\hosted\pub.dev" -Filter "smtc_windows-*" | Select-Object -First 1
          if ($smtcDir) {
            $winDir = Join-Path $smtcDir.FullName "windows"
            $dest = Join-Path $winDir "smtc_windows-v0.1.3.tar.gz"
            $targetDir = Join-Path $winDir "smtc_windows-v0.1.3"
            Write-Host "Pre-downloading smtc_windows bundle to $dest"
            curl.exe -L --retry 5 --retry-delay 2 "https://github.com/KRTirtho/frb_plugins/releases/download/smtc_windows-v0.1.3/windows.tar.gz" -o $dest
            New-Item -ItemType Directory -Force -Path $targetDir
            tar.exe -xzf $dest -C $targetDir
            $cmakeFile = Join-Path $winDir "CMakeLists.txt"
            $lines = @(
              'cmake_minimum_required(VERSION 3.14)'
              'project("smtc_windows" LANGUAGES CXX)'
              'set(smtc_windows_bundled_libraries'
              '  "${CMAKE_CURRENT_SOURCE_DIR}/smtc_windows-v0.1.3/${FLUTTER_TARGET_PLATFORM}/smtc_windows.dll"'
              '  PARENT_SCOPE'
              ')'
            )
            Set-Content -Path $cmakeFile -Value $lines
            Write-Host "Configured $cmakeFile with pre-extracted binaries."
          }
      - name: Pre-download mpv audio bundle for media_kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64
          curl.exe -L --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/media-kit/libmpv-win32-audio-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z" -o "build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z"
          $md5 = (Get-FileHash -Algorithm MD5 "build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z").Hash.ToLower()
          if ($md5 -ne "cd738e16e2a19626d7cfa48801524f8c") {
            Write-Error "MD5 mismatch for mpv bundle: $md5"
          }
      - run: flutter build windows --release --dart-define=ENABLE_UPDATES=true
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows\euphony.iss
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-windows
          path: installer/windows/installer_out/euphony-windows-setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps (GTK + libmpv for media_kit)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release --dart-define=ENABLE_UPDATES=true
      - name: Build AppImage and Debian package
        run: |
          sudo apt-get install -y wget file dpkg-dev
          bash installer/linux/build_appimage.sh
          bash installer/linux/build_deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-linux
          path: |
            euphony-linux-x86_64.AppImage
            dist/*.deb
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --release --dart-define=ENABLE_UPDATES=true
      - name: Build DMG
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          mkdir -p dmg_stage
          cp -R "$APP" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname Euphony -srcfolder dmg_stage -ov -format UDZO \
            "$GITHUB_WORKSPACE/euphony-macos.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-macos
          path: euphony-macos.dmg
          if-no-files-found: error

  build-ios:
    name: Build iOS (unsigned IPA)
    runs-on: macos-latest
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          # An unsigned IPA is just the .app inside a Payload/ folder, zipped.
          # Install it with a sideloader (AltStore, Sideloadly, TrollStore).
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr "$GITHUB_WORKSPACE/euphony-ios.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-ios
          path: euphony-ios.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-windows, build-linux, build-macos, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Pull every platform's artifact into dist/<artifact-name>/…
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Inject Release Tag into Download Links
        run: |
          sed -i "s|releases/download/v[0-9.]*|releases/download/${{ github.ref_name }}|g" RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/euphony-release-apks/**/*.apk
            dist/euphony-windows/*.exe
            dist/euphony-linux/euphony-linux-*.AppImage
            dist/euphony-linux/**/*.deb
            dist/euphony-macos/*.dmg
            dist/euphony-ios/*.ipa
          # Human-written, community-friendly notes live in RELEASE_NOTES.md so
          # every release reads for people, not from a raw commit log. Update
          # that file before tagging a new version. Auto-generated notes are off
          # for the same reason.
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
