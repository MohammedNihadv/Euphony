name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate code and format
        run: |
          dart run build_runner build
          dart format .

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate code for Release build
        run: |
          dart run build_runner build

      - name: Build Release APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: euphony-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: euphony-release-apks
          path: apks

      - uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          body: |
            ### Which APK Should I Download?

            | APK File | Target Device | Recommendation |
            | :--- | :--- | :--- |
            | `app-arm64-v8a-release.apk` | Modern Android Phones & Tablets | **Recommended for 99% of devices** (manufactured 2017+). Smallest file size (~42 MB) and best performance. |
            | `app-armeabi-v7a-release.apk` | Older 32-bit Android Devices | For older budget smartphones or legacy 32-bit devices. |
            | `app-x86_64-release.apk` | Emulators & Chromebooks | For Android Studio / BlueStacks emulators, PCs, and Intel Chromebooks. |
