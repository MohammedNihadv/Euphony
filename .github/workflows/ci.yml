name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate code and format
        run: |
          dart run build_runner build
          dart format .

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test --coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate code for Release build
        run: |
          dart run build_runner build

      # Sign every release with one stable key so users can update between
      # versions (an unsigned/debug build gets a fresh key each run, and Android
      # refuses to install an update whose signature changed). Falls back to
      # debug signing when the secret is absent, so forks still build.
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/euphony-release.jks
          {
            echo "storeFile=euphony-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build Release APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v7
        with:
          name: euphony-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  # Desktop builds only run for release tags — they are slower and the Android
  # app is what most pushes touch. Branch/PR desktop builds live in desktop.yml.
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath euphony-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-windows
          path: euphony-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps (GTK + libmpv for media_kit)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar -czf $GITHUB_WORKSPACE/euphony-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-linux
          path: euphony-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          zip -r -y "$GITHUB_WORKSPACE/euphony-macos.zip" "$APP"
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-macos
          path: euphony-macos.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Pull every platform's artifact into dist/<artifact-name>/…
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/euphony-release-apks/*.apk
            dist/euphony-windows/*.zip
            dist/euphony-linux/*.tar.gz
            dist/euphony-macos/*.zip
          # Human-written, community-friendly notes live in RELEASE_NOTES.md so
          # every release reads for people, not from a raw commit log. Update
          # that file before tagging a new version. Auto-generated notes are off
          # for the same reason.
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
