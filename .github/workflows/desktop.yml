name: Desktop builds

on:
  push:
    tags: ['v*-desktop']
  workflow_dispatch:

# These are build-only checks; the token needs nothing but read access.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Pre-download mpv audio bundle for media_kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64
          curl.exe -L --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/media-kit/libmpv-win32-audio-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z" -o "build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z"
          $md5 = (Get-FileHash -Algorithm MD5 "build/windows/x64/mpv-dev-x86_64-20230924-git-652a1dd.7z").Hash.ToLower()
          if ($md5 -ne "cd738e16e2a19626d7cfa48801524f8c") {
            Write-Error "MD5 mismatch for mpv bundle: $md5"
          }
      - run: flutter build windows --release
      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.1 installer/windows/euphony.iss
      - name: Package Portable Zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath euphony-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-windows-portable
          path: euphony-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-windows-installer
          path: installer/windows/installer_out/euphony-windows-setup.exe

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps (GTK + libmpv for media_kit)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar -czf $GITHUB_WORKSPACE/euphony-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-linux
          path: euphony-linux-x64.tar.gz

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          zip -r -y "$GITHUB_WORKSPACE/euphony-macos.zip" "$APP"
      - uses: actions/upload-artifact@v7
        with:
          name: euphony-macos
          path: euphony-macos.zip

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign
