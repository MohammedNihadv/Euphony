name: Build and update Linux AppImage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the AppImage to'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv wget file
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Build AppImage
        run: bash installer/linux/build_appimage.sh
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.release_tag }} Euphony-x86_64.AppImage euphony-linux-x86_64.AppImage --clobber --repo ${{ github.repository }}
