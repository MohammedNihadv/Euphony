name: euphony
description: "Euphony — a music streaming client for Android."
publish_to: 'none'
version: 1.0.1+10001

environment:
  sdk: ^3.12.1

dependencies:
  audio_service: ^0.18.17
  collection: ^1.19.1
  device_info_plus: ^12.4.0
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: 8.1.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  logging: ^1.3.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  meta: ^1.18.0

  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  uuid: ^4.5.1
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  riverpod_generator: ^4.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dependency_overrides:
  freezed_annotation: any
  flutter_plugin_android_lifecycle: 2.0.22

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c
      defines:
        default_options: false
        defines:
          # Mirrors the package defaults, except SQLITE_OMIT_DECLTYPE is
          # dropped and SQLITE_ENABLE_COLUMN_METADATA is added: the Linux
          # linker script exported by the sqlite3 package requires
          # sqlite3_column_table_name, which only exists with column
          # metadata enabled (and is mutually exclusive with OMIT_DECLTYPE).
          - SQLITE_ENABLE_DBSTAT_VTAB
          - SQLITE_ENABLE_FTS5
          - SQLITE_ENABLE_RTREE
          - SQLITE_ENABLE_MATH_FUNCTIONS
          - SQLITE_DQS=0
          - SQLITE_DEFAULT_MEMSTATUS=0
          - SQLITE_TEMP_STORE=2
          - SQLITE_MAX_EXPR_DEPTH=0
          - SQLITE_STRICT_SUBTYPE=1
          - SQLITE_OMIT_AUTHORIZATION
          - SQLITE_OMIT_DEPRECATED
          - SQLITE_OMIT_PROGRESS_CALLBACK
          - SQLITE_OMIT_SHARED_CACHE
          - SQLITE_OMIT_TCL_VARIABLE
          - SQLITE_OMIT_TRACE
          - SQLITE_USE_ALLOCA
          - SQLITE_ENABLE_SESSION
          - SQLITE_ENABLE_PREUPDATE_HOOK
          - SQLITE_UNTESTABLE
          - SQLITE_HAVE_ISNAN
          - SQLITE_HAVE_LOCALTIME_R
          - SQLITE_HAVE_LOCALTIME_S
          - SQLITE_HAVE_MALLOC_USABLE_SIZE
          - SQLITE_HAVE_STRCHRNUL
          - SQLITE_ENABLE_BATCH_ATOMIC_WRITE
          - SQLITE_ENABLE_COLUMN_METADATA
