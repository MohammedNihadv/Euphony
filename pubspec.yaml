name: euphony
description: "Euphony — a music streaming client for Android."
publish_to: 'none'
version: 0.2.11+1

environment:
  sdk: ^3.12.1

dependencies:
  audio_service: ^0.18.17
  collection: ^1.19.1
  device_info_plus: ^12.4.0
  dio: ^5.10.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  file_picker: 8.1.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^15.1.3
  just_audio: ^0.9.46
  just_audio_media_kit: ^2.1.0
  logging: ^1.3.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  meta: ^1.18.0
  open_filex: ^4.7.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.4
  test: ^1.31.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dependency_overrides:
  freezed_annotation: any
  flutter_plugin_android_lifecycle: 2.0.22

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
